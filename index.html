xt-wrap:balance\">Made for Ontario Grade 9 Geography.<\u002Fh2><div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:16px\"><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#11234A;border:1px solid #11234A\"><span style=\"font:700 13px 'IBM Plex Mono';color:#fff\">CGC1W<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#C7D4E6\">COURSE CODE<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F2EA;border:1px solid #E6DFD1\"><span style=\"font:700 13px 'IBM Plex Mono';color:#11234A\">2024<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#6B7280\">ISSUED<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F2EA;border:1px solid #E6DFD1\"><span style=\"font:700 13px 'IBM Plex Mono';color:#11234A\">Grade 9<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#6B7280\">DE-STREAMED<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F2EA;border:1px solid #E6DFD1\"><span style=\"font:700 13px 'IBM Plex Mono';color:#11234A\">5<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#6B7280\">STRANDS<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 340px;display:flex;flex-direction:column;gap:12px;margin-top:6px\"><p style=\"margin:0;font:400 15.5px/1.65 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">iMindz follows the <a href=\"https://www.dcp.edu.gov.on.ca/en/curriculum/canadian-and-world-studies/courses/cgc1w/home\" target=\"_blank\" rel=\"noopener\" style=\"color:#2B63A4;font-weight:600;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#1B4877\">official Ontario Grade 9 Geography curriculum (CGC1W, 2024)<\u002Fa> or:#4A5468\">↑<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 18px;background:oklch(0.965 0.03 25);border:1px solid oklch(0.88 0.06 25);border-radius:12px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex:1 1 280px;min-width:0\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 25);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">A<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:700 15.5px/1.25 'IBM Plex Sans';color:#11234A\">Geographic Inquiry and Skill Development<\u002Fspan><span style=\"font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\">The skills you use in every strand above<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:3px 14px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• The geographic inquiry process<\u002Fspan><span>• Geographic thinking concepts<\u002Fspan><span>• Geospatial technologies<\u002Fspan><span>• Careers<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:16px;border-left:1px solid oklch(0.85 0.06 25)\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">A1<\u002Fb><span>Geographic Inquiry<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">A2<\u002Fb><span>Developing Transferable Skills<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;text-align:right;font:400 12px/1.5 'IBM Plex Sans';color:#7A8699\">iMindz Learning Systems is independent and is not affiliated with or endorsed by the Ontario Ministry of Education.<\u002Fp>\n    <\u002Fsection>\n    <section style=\"padding:56px clamp(16px, 2.6vw, 32px) 20px;background:oklch(0.975 0.02 45);border-top:1px solid oklch(0.9 0.03 45)\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 48px;align-items:flex-start\">\n        <div style=\"flex:1 1 360px\"><div style=\"font:600 11px 'IBM Plex Sans';letter-spacing:.14em;color:#2B63A4\">HOW YOU’LL BE ASSESSED<\u002Fdiv><h2 style=\"margin:10px 0 0;font:700 clamp(24px, 4.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">Know how you’re marked.<\u002Fh2><\u002Fdiv>\n        <p style=\"flex:1 1 320px;margin:0;padding-top:22px;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Every Ontario high school course is marked using the same rules, from the Ministry’s <a href=\"https://www.ontario.ca/document/growing-success-assessment-evaluation-and-reporting-ontario-schools\" target=\"_blank\" rel=\"noopener\" style=\"color:#2B63A4;font-weight:600;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#1B4877\"><i>Growing Success<\u002Fi> policy<\u002Fa>. Here it is, simplified.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding:22px 22px 24px;border-radius:16px;background:#fff;border:1px solid oklch(0.9 0.03 45)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 10.5px 'IBM Plex Sans';letter-spacing:.12em;color:oklch(0.45 0.12 45)\">FROM THE CURRICULUM · ONTARIO GRADE 9 GEOGRAPHY (CGC1W)<\u002Fspan><span style=\"font:700 28px/1.05 'Caveat';color:#2E2E2E\">The geographic inquiry process<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr);gap:10px 14px;align-items:center\">\n            <span style=\"font:600 10.5px 'IBM Plex Sans';letter-spacing:.1em;color:#7A8699\">PROCESS<\u002Fspan><span style=\"font:600 10.5px 'IBM Plex Sans';letter-spacing:.1em;color:#7A8699\">WHAT JARVIS MIGHT ASK<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"flex:none;font:700 22px/1 'Caveat';color:oklch(0.48 0.13 45)\">1<\u002Fspan><span style=\"font:600 15px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Formulate questions<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:flex-start;gap:7px;min-width:0\"><span style=\"flex:1 1 auto;padding:8px 14px;background:oklch(0.97 0.025 45);border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:12px 225px 12px 255px / 255px 12px 225px 12px;font:500 20px/1.25 'Caveat';color:#2E2E2E;text-wrap:pretty\">What do you want to find out about this place or issue?<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"flex:none;font:700 22px/1 'Caveat';color:oklch(0.48 0.13 45)\">2<\u002Fspan><span style=\"font:600 15px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Gather and organize<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:flex-start;gap:7px;min-width:0\"><span style=\"flex:1 1 auto;padding:8px 14px;background:oklch(0.97 0.025 45);border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:255px 12px 225px 12px / 12px 225px 12px 255px;font:500 20px/1.25 'Caveat';color:#2E2E2E;text-wrap:pretty\">Which sources and data would help, and can you trust them?<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"flex:none;font:700 22px/1 'Caveat';color:oklch(0.48 0.13 45)\">3<\u002Fspan><span style=\"font:600 15px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Interpret and analyse<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:flex-start;gap:7px;min-width:0\"><span style=\"flex:1 1 auto;padding:8px 14px;background:oklch(0.97 0.025 45);border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:12px 225px 12px 255px / 255px 12px 225px 12px;font:500 20px/1.25 'Caveat';color:#2E2E2E;text-wrap:pretty\">What patterns or connections do you see in the map or data?<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"flex:none;font:700 22px/1 'Caveat';color:oklch(0.48 0.13 45)\">4<\u002Fspan><span style=\"font:600 15px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Evaluate and draw conclusions<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:flex-start;gap:7px;min-width:0\"><span style=\"flex:1 1 auto;padding:8px 14px;background:oklch(0.97 0.025 45);border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:255px 12px 225px 12px / 12px 225px 12px 255px;font:500 20px/1.25 'Caveat';color:#2E2E2E;text-wrap:pretty\">Based on the evidence, what would you conclude?<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"flex:none;font:700 22px/1 'Caveat';color:oklch(0.48 0.13 45)\">5<\u002Fspan><span style=\"font:600 15px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Communicate<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:flex-start;gap:7px;min-width:0\"><span style=\"flex:1 1 auto;padding:8px 14px;background:oklch(0.97 0.025 45);border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:12px 225px 12px 255px / 255px 12px 225px 12px;font:500 20px/1.25 'Caveat';color:#2E2E2E;text-wrap:pretty\">How would you present this with a map, chart or the right terms?<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding:22px 22px 24px;border-radius:16px;background:#fff;border:1px solid oklch(0.9 0.03 45)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 10.5px 'IBM Plex Sans';letter-spacing:.12em;color:oklch(0.45 0.12 45)\">FROM GROWING SUCCESS · ONTARIO ASSESSMENT POLICY<\u002Fspan><span style=\"font:700 28px/1.05 'Caveat';color:#2E2E2E\">The four achievement chart categories<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:#FFFEFA;border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:12px 225px 12px 255px / 255px 12px 225px 12px;transform:rotate(-0.6deg)\"><div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:700 32px/1 'Caveat';color:oklch(0.45 0.12 70)\">K<\u002Fspan><span style=\"font:700 15px/1.2 'IBM Plex Sans';color:#11234A\">Knowledge and Understanding<\u002Fspan><\u002Fdiv><span style=\"font:500 18px/1.25 'Caveat';color:#4A4A4A\">Checks you understand the key ideas before moving on.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:#FFFEFA;border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:255px 12px 225px 12px / 12px 225px 12px 255px;transform:rotate(0.5deg)\"><div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:700 32px/1 'Caveat';color:oklch(0.45 0.12 300)\">T<\u002Fspan><span style=\"font:700 15px/1.2 'IBM Plex Sans';color:#11234A\">Thinking<\u002Fspan><\u002Fdiv><span style=\"font:500 18px/1.25 'Caveat';color:#4A4A4A\">You plan the approach and work through each step.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:#FFFEFA;border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:12px 225px 12px 255px / 255px 12px 225px 12px;transform:rotate(0.4deg)\"><div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:700 32px/1 'Caveat';color:oklch(0.45 0.12 195)\">C<\u002Fspan><span style=\"font:700 15px/1.2 'IBM Plex Sans';color:#11234A\">Communication<\u002Fspan><\u002Fdiv><span style=\"font:500 18px/1.25 'Caveat';color:#4A4A4A\">Asks you to explain your reasoning, not just the answer.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:#FFFEFA;border:1.7px solid #3B3B3B;box-shadow:1.5px 1.5px 0 rgba(60,60,60,.35);border-radius:255px 12px 225px 12px / 12px 225px 12px 255px;transform:rotate(-0.5deg)\"><div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:700 32px/1 'Caveat';color:oklch(0.45 0.12 150)\">A<\u002Fspan><span style=\"font:700 15px/1.2 'IBM Plex Sans';color:#11234A\">Application<\u002Fspan><\u002Fdiv><span style=\"font:500 18px/1.25 'Caveat';color:#4A4A4A\">Nudges you to try it on a new or similar problem.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:12px;border-top:1.6px dashed #C9C2B4;font:700 22px/1.25 'Caveat';color:#3B3B3B\">Same skills. Same categories. <span style=\"padding:0 4px;background:linear-gradient(transparent 42%,oklch(0.86 0.13 45 / .75) 42% 90%,transparent 90%)\">No shortcuts.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n      <section style=\"padding:8px clamp(16px, 2.6vw, 32px) 52px;background:oklch(0.975 0.02 45)\"><div style=\"display:flex;flex-wrap:wrap;gap:12px 48px;align-items:flex-start\">\n        <div style=\"flex:1 1 360px\"><div style=\"font:600 11px 'IBM Plex Sans';letter-spacing:.14em;color:#2B63A4\">HOW MARKS WORK<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><sc-if value=\"{{ asA }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));gap:12px\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px\"><div style=\"display:flex;flex-direct nter;font:700 12px 'IBM Plex Mono'\">2<\u002Fspan><span style=\"font:700 15.5px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Four things teachers look for<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:5px\"><div style=\"display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:oklch(0.96 0.03 45)\"><span style=\"font:700 13px 'IBM Plex Mono';color:oklch(0.45 0.13 45)\">K<\u002Fspan><span style=\"font:600 12.5px 'IBM Plex Sans';color:#11234A;white-space:nowrap\">Knowledge<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:oklch(0.96 0.03 45)\"><span style=\"font:700 13px 'IBM Plex Mono';color:oklch(0.45 0.13 45)\">T<\u002Fspan><span style=\"font:600 12.5px 'IBM Plex Sans';color:#11234A;white-space:nowrap\">Thinking<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:oklch(0.96 0.03 45)\"><span style=\"font:700 13px 'IBM Plex Mono';color:oklch(0.45 0.13 45)\">C<\u002Fspan><span style=\"font:600 12.5px 'IBM Plex Sans';color:#11234A;white-space:nowrap\">Communication<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;background:oklch(0.96 0.03 45)\"><span style=\"font:700 13px 'IBM Plex Mono';color:oklch(0.45 0.13 45)\">A<\u002Fspan><span style=\"font:600 12.5px 'IBM Plex Sans';color:#11234A;white-space:nowrap\">Application<\u002Fspan><\u002Fdiv><\u002Fdiv><span style=\"font:400 13px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Explaining your thinking earns marks, not just the right answer.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px\"><div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 16px 18px;border-radius:14px;background:#fff;border:1px solid #E6DFD1\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:26px;height:26px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">3<\u002Fspan><span style=\"font:700 15.5px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Four levels<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:3px\"><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:7px;background:oklch(0.93 0.05 25);\"><span style=\"font:700 12.5px 'IBM Plex Sans';color:#11234A\">L1<\u002Fspan><span style=\"font:600 11px 'IBM Plex Mono';color:#11234A\">50%<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:7px;background:oklch(0.93 0.06 70);\"><span style=\"font:700 12.5px 'IBM Plex Sans';color:#11234A\">L2<\u002Fspan><span style=\"font:600 11px 'IBM Plex Mono';color:#11234A\">60%<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:7px;background:oklch(0.9 0.08 150);outline:2px solid #11234A;outline-offset:-2px;\"><span style=\"font:700 12.5px 'IBM Plex Sans';color:#11234A\">L3<\u002Fspan><span style=\"font:600 11px 'IBM Plex Mono';color:#11234A\">70%<\u002Fspan><\u002Fdiv><div style=\"flex:2 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;border-radius:7px;background:oklch(0.86 0.1 150);\"><span style=\"font:700 12.5px 'IBM Plex Sans';color:#11234A\">L4<\u002Fspan><span style=\"font:600 11px 'IBM Plex Mono';color:#11234A\">80+%<\u002Fspan><\u002Fdiv><\u002Fdiv><span style=\"font:400 13px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\"><b style=\"color:#11234A\">Level 3 (70–79%)<\u002Fb> is the provincial standard. Below 50%, no credit.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 16px 18px;border-radius:14px;background:#fff;border:1px solid #E6DFD1\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:26px;height:26px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">4<\u002Fspan><span style=\"font:700 15.5px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Your final mark<\u002Fspan><\u002Fdiv><div style=\"display:flex;height:40px;border-radius:8px;overflow:hidden\"><div style=\"flex:70 1 0;background:#11234A;color:#fff;display:flex;align-items:center;padding:0 10px;font:700 15px 'IBM Plex Mono'\">70%<\u002Fdiv><div style=\"flex:30 1 0;background:oklch(0.96 0.03 45);color:#11234A;display:flex;align-items:center;padding:0 8px;font:700 15px 'IBM Plex Mono'\">30%<\u002Fdiv><\u002Fdiv><span style=\"font:400 13px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">70% from work during the course. 30% from a final exam, project or presentation.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 16px;border-radius:12px;background:oklch(0.96 0.03 45);font:400 13px/1.5 'IBM Plex Sans';color:#3A4458\"><span><b style=\"color:#11234A\">Evidence:<\u002Fb> observations, conversations and the work you hand in.<\u002Fspan><span><b style=\"color:#11234A\">Learning skills<\u002Fb> (like organization and initiative) are reported separately and don’t change your mark.<\u002Fspan><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ asB }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:24px;border-radius:16px;background:#fff;border:1px solid #E6DFD1;overflow:hidden\"><div style=\"\"><div sc-camel-on-click=\"{{ asT1 }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px\" style-hover=\"background:#FBF8F2\"><span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">1<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font:700 16px/1.3 'IBM Plex Sans';color:#11234A\">Only some work counts toward your mark<\u002Fspan><span style=\"flex:none;font:600 12.5px 'IBM Plex Mono';color:oklch(0.45 0.13 45);background:oklch(0.96 0.03 45);padding:4px 10px;border-radius:999px;white-space:nowrap\">3 kinds · 1 is graded<\u002Fspan><span style=\"flex:none;width:24px;text-align:center;font:500 20px 'IBM Plex Sans';color:#5B6577\">{{ asSign1 }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ asO1 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 20px 20px 62px;display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">There are three kinds of assessment. Two are there to help you learn. Only one is graded.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"align-self:flex-start;font:600 11px 'IBM Plex Sans';letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#F1EDE4;color:#5B6577\">NOT MARKED<\u002Fspan><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Assessment <i>for<\u002Fi> learning<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Your teacher checks how you’re doing and gives feedback to help you improve.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"align-self:flex-start;font:600 11px 'IBM Plex Sans';letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#F1EDE4;color:#5B6577\">NOT MARKED<\u002Fspan><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Assessment <i>as<\u002Fi> learning<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">You check your own work, or a classmate’s, and set goals.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;border:1.5px solid #11234A\"><span style=\"align-self:flex-start;font:600 11px 'IBM Plex Sans';letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#11234A;color:#fff\">COUNTS<\u002Fspan><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Assessment <i>of<\u002Fi> learning<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Tests, projects and tasks that are evaluated and go toward your mark.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px;font:500 13.5px/1.5 'IBM Plex Sans';color:oklch(0.45 0.13 45)\">Practising with Jarvis is assessment <i>for<\u002Fi> learning: feedback only, never marked.<\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><div style=\"border-top:1px solid #E6DFD1\"><div sc-camel-on-click=\"{{ asT2 }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px\" style-hover=\"background:#FBF8F2\"><span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">2<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font:700 16px/1.3 'IBM Plex Sans';color:#11234A\">Four things your teacher looks for<\u002Fspan><span style=\"flex:none;font:600 12.5px 'IBM Plex Mono';color:oklch(0.45 0.13 45);background:oklch(0.96 0.03 45);padding:4px 10px;border-radius:999px;white-space:nowrap\">K · T · C · A<\u002Fspan><span style=\"flex:none;width:24px;text-align:center;font:500 20px 'IBM Plex Sans';color:#5B6577\">{{ asSign2 }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ asO2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 20px 20px 62px;display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Every course is marked on the same four categories. A right answer alone isn’t enough; showing and explaining your thinking counts too.<\u002Fp><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">K<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Knowledge and Understanding<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Knowing the facts, terms and skills, and what they mean.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">T<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Thinking<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Planning and working through problems or investigations.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">C<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Communication<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Explaining your ideas clearly, in words, diagrams or numbers.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">A<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Application<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Using what you know in new or real-life situations.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><div style=\"border-top:1px solid #E6DFD1\"><div sc-camel-on-click=\"{{ asT3 }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px\" style-hover=\"background:#FBF8F2\"><span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">3<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font:700 16px/1.3 'IBM Plex Sans';color:#11234A\">Four levels of achievement<\u002Fspan><span style=\"flex:none;font:600 12.5px 'IBM Plex Mono';color:oklch(0.45 0.13 45);background:oklch(0.96 0.03 45);padding:4px 10px;border-radius:999px;white-space:nowrap\">Level 3 = 70–79%<\u002Fspan><span style=\"flex:none;width:24px;text-align:center;font:500 20px 'IBM Plex Sans';color:#5B6577\">{{ asSign3 }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ asO3 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 20px 20px 62px;display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your work in each category is placed on one of four levels, each matched to a percentage range.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:4px;align-items:stretch\"><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.93 0.05 25);\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 1<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">50–59%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">Limited<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.93 0.06 70);\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 2<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">60–69%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">Some<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.9 0.08 150);outline:2px solid #11234A;outline-offset:-2px;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 3<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">70–79%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">Considerable<\u002Fspan><\u002Fdiv><div style=\"flex:2 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.86 0.1 150);\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 4<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">80–100%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">High degree<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px;font:400 13px/1.5 'IBM Plex Sans';color:#4A5468\"><span><b style=\"color:#11234A\">Level 3 is the provincial standard<\u002Fb>: the level every student is aiming for.<\u002Fspan><span>Below 50%, the credit isn’t earned.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><div style=\"border-top:1px solid #E6DFD1\"><div sc-camel-on-click=\"{{ asT4 }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px\" style-hover=\"background:#FBF8F2\"><span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">4<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font:700 16px/1.3 'IBM Plex Sans';color:#11234A\">How your final mark adds up<\u002Fspan><span style=\"flex:none;font:600 12.5px 'IBM Plex Mono';color:oklch(0.45 0.13 45);background:oklch(0.96 0.03 45);padding:4px 10px;border-radius:999px;white-space:nowrap\">70% + 30%<\u002Fspan><span style=\"flex:none;width:24px;text-align:center;font:500 20px 'IBM Plex Sans';color:#5B6577\">{{ asSign4 }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ asO4 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 20px 20px 62px;display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your final mark comes from two parts, weighted 70% and 30%.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;height:64px;border-radius:12px;overflow:hidden;border:1px solid #E6DFD1\"><div style=\"flex:70 1 0;background:#11234A;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 16px;gap:2px\"><span style=\"font:700 22px 'IBM Plex Mono'\">70%<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#C7D4E6\">Work during the course<\u002Fspan><\u002Fdiv><div style=\"flex:30 1 0;min-width:0;background:oklch(0.96 0.03 45);color:#11234A;display:flex;flex-direction:column;justify-content:center;padding:0 14px;gap:2px\"><span style=\"font:700 22px 'IBM Plex Mono'\">30%<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#3A4458\">Final evaluation<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 13px/1.55 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">The final evaluation happens near the end of the course. It might be an exam, a project, a presentation or a mix.<\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><div style=\"border-top:1px solid #E6DFD1\"><div sc-camel-on-click=\"{{ asT5 }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px\" style-hover=\"background:#FBF8F2\"><span style=\"flex:none;width:28px;height:28px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px 'IBM Plex Mono'\">5<\u002Fspan><span style=\"flex:1 1 auto;min-width:0;font:700 16px/1.3 'IBM Plex Sans';color:#11234A\">How your teacher gathers evidence<\u002Fspan><span style=\"flex:none;font:600 12.5px 'IBM Plex Mono';color:oklch(0.45 0.13 45);background:oklch(0.96 0.03 45);padding:4px 10px;border-radius:999px;white-space:nowrap\">Observe · talk · products<\u002Fspan><span style=\"flex:none;width:24px;text-align:center;font:500 20px 'IBM Plex Sans';color:#5B6577\">{{ asSign5 }}<\u002Fspan><\u002Fdiv><sc-if value=\"{{ asO5 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:0 20px 20px 62px;display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your mark is based on more than tests. Teachers look at three kinds of evidence.<\u002Fp><div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Observations<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">What your teacher sees you do in class.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Conversations<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">What you explain when you talk it through.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Products<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">What you hand in: tests, projects, assignments.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:oklch(0.96 0.03 45)\"><span style=\"font:600 13.5px/1.45 'IBM Plex Sans';color:#11234A\">Learning skills are reported separately and don’t affect your mark:<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Responsibility<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Organization<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Independent work<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Collaboration<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Initiative<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Self-regulation<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ asC }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:24px;border-radius:16px;background:#1C3C84;color:#fff;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px 20px\"><div style=\"display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:2px solid oklch(0.85 0.12 70)\"><span style=\"font:700 30px/1 'IBM Plex Mono';color:#fff\">3<\u002Fspan><span style=\"font:600 14px 'IBM Plex Sans';color:#fff\">kinds of assessment<\u002Fspan><span style=\"font:400 12.5px/1.4 'IBM Plex Sans';color:#C7D4E6\">only “of learning” is graded<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:2px solid oklch(0.85 0.12 70)\"><span style=\"font:700 30px/1 'IBM Plex Mono';color:#fff\">4<\u002Fspan><span style=\"font:600 14px 'IBM Plex Sans';color:#fff\">categories<\u002Fspan><span style=\"font:400 12.5px/1.4 'IBM Plex Sans';color:#C7D4E6\">Knowledge, Thinking, Communication, Application<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:2px solid oklch(0.85 0.12 70)\"><span style=\"font:700 30px/1 'IBM Plex Mono';color:#fff\">L3<\u002Fspan><span style=\"font:600 14px 'IBM Plex Sans';color:#fff\">70–79%<\u002Fspan><span style=\"font:400 12.5px/1.4 'IBM Plex Sans';color:#C7D4E6\">the provincial standard<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;padding-left:14px;border-left:2px solid oklch(0.85 0.12 70)\"><span style=\"font:700 30px/1 'IBM Plex Mono';color:#fff\">70/30<\u002Fspan><span style=\"font:600 14px 'IBM Plex Sans';color:#fff\">final mark<\u002Fspan><span style=\"font:400 12.5px/1.4 'IBM Plex Sans';color:#C7D4E6\">course work / final evaluation<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)\"><span style=\"font:400 13px 'IBM Plex Sans';color:#C7D4E6\">Learning skills are reported separately and don’t change your mark.<\u002Fspan><div sc-camel-on-click=\"{{ toggleAsFull }}\" style=\"cursor:pointer;font:600 14px 'IBM Plex Sans';color:#11234A;background:#fff;padding:9px 16px;border-radius:10px\" style-hover=\"background:#EEF2F9\">{{ asFullLabel }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ asFull }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:14px;padding:4px 26px;border-radius:18px;background:#FFFEFB;border:1px solid #E6DFD1;box-shadow:0 10px 30px rgba(17,35,74,.06)\">\n        <div><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px;padding:28px 0\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:420px\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:34px;height:34px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px 'IBM Plex Mono'\">1<\u002Fspan><span style=\"font:700 20px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Only some work counts toward your mark<\u002Fspan><\u002Fdiv><p style=\"margin:0;padding-left:46px;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">There are three kinds of assessment. Two are there to help you learn. Only one is graded.<\u002Fp><\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"align-self:flex-start;font:600 11px 'IBM Plex Sans';letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#F1EDE4;color:#5B6577\">NOT MARKED<\u002Fspan><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Assessment <i>for<\u002Fi> learning<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Your teacher checks how you’re doing and gives feedback to help you improve.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"align-self:flex-start;font:600 11px 'IBM Plex Sans';letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#F1EDE4;color:#5B6577\">NOT MARKED<\u002Fspan><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Assessment <i>as<\u002Fi> learning<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">You check your own work, or a classmate’s, and set goals.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;border:1.5px solid #11234A\"><span style=\"align-self:flex-start;font:600 11px 'IBM Plex Sans';letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:#11234A;color:#fff\">COUNTS<\u002Fspan><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Assessment <i>of<\u002Fi> learning<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Tests, projects and tasks that are evaluated and go toward your mark.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px;font:500 13.5px/1.5 'IBM Plex Sans';color:oklch(0.45 0.13 45)\">Practising with Jarvis is assessment <i>for<\u002Fi> learning: feedback only, never marked.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px;padding:28px 0;border-top:1px solid #E6DFD1\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:420px\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:34px;height:34px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px 'IBM Plex Mono'\">2<\u002Fspan><span style=\"font:700 20px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Four things your teacher looks for<\u002Fspan><\u002Fdiv><p style=\"margin:0;padding-left:46px;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Every course is marked on the same four categories. A right answer alone isn’t enough; showing and explaining your thinking counts too.<\u002Fp><\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">K<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Knowledge and Understanding<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Knowing the facts, terms and skills, and what they mean.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">T<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Thinking<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Planning and working through problems or investigations.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">C<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Communication<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Explaining your ideas clearly, in words, diagrams or numbers.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:30px;height:30px;border-radius:8px;background:oklch(0.96 0.03 45);color:oklch(0.45 0.13 45);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Mono'\">A<\u002Fspan><span style=\"font:700 15px/1.25 'IBM Plex Sans';color:#11234A\">Application<\u002Fspan><\u002Fdiv><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">Using what you know in new or real-life situations.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px;padding:28px 0;border-top:1px solid #E6DFD1\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:420px\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:34px;height:34px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px 'IBM Plex Mono'\">3<\u002Fspan><span style=\"font:700 20px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">Four levels of achievement<\u002Fspan><\u002Fdiv><p style=\"margin:0;padding-left:46px;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your work in each category is placed on one of four levels, each matched to a percentage range.<\u002Fp><\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:4px;align-items:stretch\"><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.93 0.05 25);\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 1<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">50–59%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">Limited<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.93 0.06 70);\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 2<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">60–69%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">Some<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.9 0.08 150);outline:2px solid #11234A;outline-offset:-2px;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 3<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">70–79%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">Considerable<\u002Fspan><\u002Fdiv><div style=\"flex:2 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 12px;border-radius:10px;background:oklch(0.86 0.1 150);\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Level 4<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#11234A\">80–100%<\u002Fspan><span style=\"font:400 12.5px/1.3 'IBM Plex Sans';color:#3A4458\">High degree<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px;font:400 13px/1.5 'IBM Plex Sans';color:#4A5468\"><span><b style=\"color:#11234A\">Level 3 is the provincial standard<\u002Fb>: the level every student is aiming for.<\u002Fspan><span>Below 50%, the credit isn’t earned.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px;padding:28px 0;border-top:1px solid #E6DFD1\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:420px\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:34px;height:34px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px 'IBM Plex Mono'\">4<\u002Fspan><span style=\"font:700 20px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">How your final mark adds up<\u002Fspan><\u002Fdiv><p style=\"margin:0;padding-left:46px;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your final mark comes from two parts, weighted 70% and 30%.<\u002Fp><\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;height:64px;border-radius:12px;overflow:hidden;border:1px solid #E6DFD1\"><div style=\"flex:70 1 0;background:#11234A;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 16px;gap:2px\"><span style=\"font:700 22px 'IBM Plex Mono'\">70%<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#C7D4E6\">Work during the course<\u002Fspan><\u002Fdiv><div style=\"flex:30 1 0;min-width:0;background:oklch(0.96 0.03 45);color:#11234A;display:flex;flex-direction:column;justify-content:center;padding:0 14px;gap:2px\"><span style=\"font:700 22px 'IBM Plex Mono'\">30%<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#3A4458\">Final evaluation<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"font:400 13px/1.55 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">The final evaluation happens near the end of the course. It might be an exam, a project, a presentation or a mix.<\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 40px;padding:28px 0;border-top:1px solid #E6DFD1\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:420px\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:34px;height:34px;border-radius:50%;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px 'IBM Plex Mono'\">5<\u002Fspan><span style=\"font:700 20px/1.25 'IBM Plex Sans';color:#11234A;text-wrap:balance\">How your teacher gathers evidence<\u002Fspan><\u002Fdiv><p style=\"margin:0;padding-left:46px;font:400 14.5px/1.6 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your mark is based on more than tests. Teachers look at three kinds of evidence.<\u002Fp><\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Observations<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">What your teacher sees you do in class.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Conversations<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">What you explain when you talk it through.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #E6DFD1;\"><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">Products<\u002Fspan><span style=\"font:400 13.5px/1.5 'IBM Plex Sans';color:#4A5468\">What you hand in: tests, projects, assignments.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:oklch(0.96 0.03 45)\"><span style=\"font:600 13.5px/1.45 'IBM Plex Sans';color:#11234A\">Learning skills are reported separately and don’t affect your mark:<\u002Fspan><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Responsibility<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Organization<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Independent work<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Collaboration<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Initiative<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;background:#fff;border:1px solid #E6DFD1;padding:4px 10px;border-radius:999px\">Self-regulation<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv><\u002Fsc-if><\u002Fsc-if><\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSession }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;overflow:hidden;margin:0 calc(50% - var(--vw) / 2);border-radius:0;background-image:linear-gradient(125deg,#1C3C84 0%,#21499A 55%,#2A5BAD 100%);color:#fff;padding:32px max(18px, calc((var(--vw) - 1240px) / 2 + 32px)) 43px\">\n      <div style=\"position:relative;min-height:calc(clamp(28px, 4.4vw, 38px) * 1.1 + 52px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:nowrap\">\n      <div style=\"display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:640px;flex:1 1 auto;min-width:0\">\n      <div style=\"position:relative;display:flex;align-items:center;gap:10px\"><span style=\"flex:none;position:relative;display:block;width:34px;height:34px\"><img src=\"/assets/fc039281-f4c3-4efc-88f5-4671f61442c3.png\" alt=\"Jarvis\" style=\"display:block;width:100%;height:100%;box-sizing:border-box;border-radius:10px;object-fit:cover;box-shadow:0 0 0 1px rgba(17,35,74,.12)\"><span style=\"position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;box-sizing:border-box;border-radius:50%;background:oklch(0.72 0.17 150);border:2px solid #1C3C84\"><\u002Fspan><\u002Fspan><span style=\"font:500 11.5px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:{{ sessAcc }}\">JARVIS · {{ sessSubj }} session<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><h1 style=\"margin:0;font:700 clamp(28px, 4.4vw, 38px)/1.1 'Sora';letter-spacing:-0.03em;text-wrap:balance\">Working on it<\u002Fh1><p style=\"margin:0;font:400 16px/1.6 'IBM Plex Sans';color:#E6ECF5\">you’re doing the thinking, Jarvis has your back<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ newMission }}\" style=\"flex:none;cursor:pointer;font:600 14px 'IBM Plex Sans';color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 14px;border-radius:999px;white-space:nowrap\" style-hover=\"background:rgba(255,255,255,.12)\">Start over<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <main style=\"flex:1;align-self:stretch;width:100%;box-sizing:border-box;padding:22px clamp(14px, 2.6vw, 32px) 40px\">\n      <div style=\"width:100%;max-width:max(1120px, calc(50% + 560px));margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n      <aside style=\"flex:1 1 240px;min-width:0;max-width:{{ asideMax }};display:{{ asideDisp }};flex-direction:column;gap:12px\">\n        <div style=\"background:#fff;border:1px solid #D9D0BE;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:32px;height:32px;border-radius:10px;background:{{ topicDot }};display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">{{ topicGlyph }}<\u002Fspan><div style=\"display:flex;flex-direction:column;line-height:1.15\"><span style=\"font:500 10.5px 'IBM Plex Mono';letter-spacing:.06em;color:#7A8699\">TOPIC<\u002Fspan><span style=\"font:700 15px 'IBM Plex Sans';color:#11234A\">{{ topicName }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font:500 10.5px 'IBM Plex Mono';letter-spacing:.06em;color:#7A8699\">YOUR QUESTION<\u002Fs
