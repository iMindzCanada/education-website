    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();

              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          }

          return;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

port><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ homeAnimB }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px 32px;align-items:center;padding:24px clamp(16px, 2.4vw, 24px);border-radius:18px;background:#fff;border:1px solid #EDE6D8\"><img src=\"/assets/a909c49b-92c7-47db-bd5c-fe29d7f5ca8b.jpg\" alt=\"A Grade 9 student thinking through a problem while Jarvis offers a nudge, a hint, an example and next steps\" style=\"display:block;width:100%;max-width:340px;justify-self:center;aspect-ratio:1/1;object-fit:cover;border-radius:16px;box-shadow:0 14px 30px rgba(17,35,74,.14)\"><div style=\"min-width:0;display:flex;flex-direction:column;gap:18px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:oklch(0.5 0.12 65)\">HOW JARVIS GETS YOU UNSTUCK<\u002Fspan><dc-import name=\"Nudge Flow\" hint-size=\"100%,190px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  \n  <sc-if value=\"{{ isJarvis }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;overflow:hidden;margin:0 calc(50% - var(--vw) / 2);background-color:oklch(0.36 0.08 185);background-image:linear-gradient(115deg, oklch(0.33 0.08 185) 0%, oklch(0.36 0.08 185) 45%, oklch(0.46 0.10 167) 100%);color:#fff;padding:32px max(18px, calc((var(--vw) - 1240px) / 2 + 32px)) 43px\">\n      <div aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;right:0;width:66%;pointer-events:none;overflow:hidden;display:{{ artDisp }};flex-wrap:wrap;align-content:center;justify-content:flex-end;gap:10px;padding:{{ artPad }};box-sizing:border-box;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));grid-auto-rows:44px;align-items:center;justify-items:center;-webkit-mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.25) 28%, #000 62%);mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.25) 28%, #000 62%)\"><sc-for list=\"{{ homeArt }}\" as=\"a\" hint-placeholder-count=\"0\"><span style=\"position:{{ a.pos }};left:{{ a.left }};top:{{ a.top }};font:{{ a.font }};color:{{ a.color }};-webkit-text-stroke:{{ a.stroke }};background:{{ a.bg }};padding:{{ a.pad }};border-radius:{{ a.rad }};opacity:{{ a.op }};transform:{{ a.tf }};white-space:nowrap;line-height:1\">{{ a.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <div style=\"position:relative;min-height:calc(clamp(28px, 4.4vw, 38px) * 1.1 + 52px);display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:640px\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;position:relative;display:block;width:38px;height:38px\"><img src=\"/assets/fc039281-f4c3-4efc-88f5-4671f61442c3.png\" alt=\"Jarvis\" style=\"display:block;width:100%;height:100%;box-sizing:border-box;border-radius:11px;object-fit:cover;box-shadow:0 0 0 1px rgba(17,35,74,.12)\"><span style=\"position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;box-sizing:border-box;border-radius:50%;background:oklch(0.72 0.17 150);border:2px solid oklch(0.33 0.08 185)\"><\u002Fspan><\u002Fspan><span style=\"font:500 11.5px 'IBM Plex Mono';letter-spacing:.1em;color:#E3F5E1\">YOUR AI LEARNING COMPANION<\u002Fspan><\u002Fdiv><h1 style=\"margin:0;font:700 clamp(28px, 4.4vw, 38px)/1.1 'Sora';letter-spacing:-0.03em\">Meet <span style=\"color:oklch(0.9 0.14 88)\">Jarvis<\u002Fspan><\u002Fh1><\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"padding:88px clamp(16px, 2.6vw, 32px) 92px;background:#FAF7F0\">\n      <div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box\"><div style=\"display:flex;flex-wrap:wrap;gap:32px 48px;align-items:center\">\n          <div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">IDEA BEHIND JARVIS<\u002Fspan><p style=\"margin:0;font:600 clamp(20px, 2.8vw, 24px)/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#33405A;text-wrap:balance\">Think back to your school days. When you got stuck on a problem, who did you turn to?<\u002Fp><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Maybe a teacher, a parent, or someone who could give you just a little direction. They didn’t always hand you the answer. They asked a question, offered a hint, helped you revisit a fundamental or pointed you to the next step. And suddenly you were back on track, working it out yourself.<\u002Fp><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We see the same thing with our own children today. Often, students don’t need another lesson or a ready-made answer. They just need a little nudge to get their thinking going.<\u002Fp><p style=\"margin:0;font:700 clamp(30px, 4vw, 36px)/1.15 'Caveat',cursive;color:#11234A\">That’s the idea behind Jarvis.<\u002Fp><\u002Fdiv>\n          <img src=\"/assets/db51d2a8-f225-4fc9-a9a0-4a2b53fdf593.jpg\" alt=\"A Grade 9 student in Toronto thinking through homework while Jarvis offers a nudge, a hint, the next step, an example and practice questions\" style=\"display:block;flex:0 1 306px;min-width:0;width:100%;max-width:306px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;box-shadow:0 18px 40px rgba(17,35,74,.16)\">\n        <\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"margin:0 calc(50% - var(--vw) / 2);padding:92px clamp(16px, 2.6vw, 32px) 96px;background:#fff;border-top:1px solid #EDE6D8\">\n      <div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:36px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start\"><div style=\"flex:0 1 280px;min-width:0;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#FFA733\">MEET JARVIS<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:4px\"><h2 style=\"margin:0;font:700 clamp(26px, 3.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">Built by Parents.<\u002Fh2><p style=\"margin:0;font:600 clamp(20px, 2.8vw, 24px)/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#33405A;text-wrap:balance\">Shaped by Teachers.<\u002Fp><\u002Fdiv><\u002Fdiv><p style=\"flex:1 1 440px;min-width:0;margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We’re parents of high schoolers, and we know how much great teachers matter. Nothing replaces the classroom. Jarvis is there for the moments in between: when your child is stuck on homework, it guides them with questions, hints and step-by-step support until they solve it themselves. We work closely with Ontario teachers and education specialists, including psychoeducational consultants, so every hint stays true to how it’s taught in class.<\u002Fp><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,208px),1fr));gap:20px;max-width:854px;width:100%;margin:0 auto\"><div style=\"display:flex;flex-direction:column;border-radius:16px;background:#fff;border:1px solid #E6DFD0;overflow:hidden\"><div style=\"position:relative;width:100%;aspect-ratio:1/1;overflow:hidden\"><img src=\"/assets/00cc25d2-4536-4558-8e46-3956f00c4708.jpg\" alt=\"A parent of a high schooler at his home desk\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:18px 20px 20px\"><span style=\"font:700 17px 'IBM Plex Sans';color:#11234A\">Parents<\u002Fspan><span style=\"font:400 14.5px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">We’re parents of high schoolers. We built exactly what we wanted for our own kids. And they’re now using it every day.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:16px;background:#fff;border:1px solid #E6DFD0;overflow:hidden\"><div style=\"position:relative;width:100%;aspect-ratio:1/1;overflow:hidden\"><img src=\"/assets/f857da87-fe1a-47f0-a2e6-85f58a572ebe.jpg\" alt=\"An Ontario Certified Teacher in a Grade 9 classroom\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:18px 20px 20px\"><span style=\"font:700 17px 'IBM Plex Sans';color:#11234A\">Ontario Certified Teachers<\u002Fspan><span style=\"font:400 14.5px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Keep every hint aligned with the Ontario curriculum and how it’s taught.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:16px;background:#fff;border:1px solid #E6DFD0;overflow:hidden\"><div style=\"position:relative;width:100%;aspect-ratio:1/1;overflow:hidden\"><img src=\"/assets/39bda916-7a14-43fa-80c0-cb8ecddc1b81.jpg\" alt=\"A registered psychologist offering psychoeducational support\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:18px 20px 20px\"><span style=\"font:700 17px 'IBM Plex Sans';color:#11234A\">Registered Psychologists &amp; Psychological Associates<\u002Fspan><span style=\"font:400 14.5px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Bring psychoeducational expertise, so every hint fits how students think and learn.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section id=\"jv-covers\" style=\"padding:92px clamp(16px, 2.6vw, 32px) 80px;background:#FAF7F0;border-top:1px solid #EDE6D8\">\n      <div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-start\"><div style=\"flex:0 1 360px;min-width:0;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">WHAT JARVIS COVERS<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:4px\"><h2 style=\"margin:0;font:700 clamp(26px, 3.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">Rooted in the Ontario Curriculum.<\u002Fh2><p style=\"margin:0;font:600 clamp(20px, 2.8vw, 24px)/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#33405A;text-wrap:balance\">Designed to help you think.<\u002Fp><\u002Fdiv><\u002Fdiv><p style=\"flex:1 1 360px;min-width:0;margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Aligned with Ontario’s current curriculum and learning expectations for each subject — matched to the official course code and the year it was last updated, so what you practice here is exactly what’s taught in class.<\u002Fp><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px;margin:28px auto 0;max-width:866px;width:100%;box-sizing:border-box\">\n        <div style=\"display:flex;flex-direction:column;border-radius:18px;background:#fff;border:1px solid #EDE6D8;overflow:hidden;box-shadow:0 14px 32px rgba(17,35,74,.06)\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(120deg,oklch(0.34 0.12 285) 35%,oklch(0.45 0.15 320));color:#fff\"><span style=\"flex:none;width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font:700 24px 'IBM Plex Mono';color:oklch(0.34 0.12 285)\">π<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font:700 22px 'IBM Plex Sans'\">Math<\u002Fspan><span style=\"font:500 12px 'IBM Plex Mono';letter-spacing:.06em;color:oklch(0.86 0.13 75)\">MTH1W · ONTARIO GRADE 9 · 2021<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div styl Ontario Inc., runs imindz.ca, an AI-assisted tutoring platform for Ontario Grade 9 Math and Science students. This policy explains what information we collect, why, and how parents can control it.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Who holds the account<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Only a parent or legal guardian creates an iMindz account and provides their own contact information. Student profiles are added to the account by the parent — students do not register independently. We do not knowingly collect personal information directly from a child without parental involvement.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Information we collect<\u002Fh2>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font:400 16px/1.65 'IBM Plex Sans';color:#33405A\"><li><strong style=\"font-weight:600;color:#11234A\">Parent account:<\u002Fstrong> name, email address, and password (or Google sign-in information if you choose that option).<\u002Fli><li><strong style=\"font-weight:600;color:#11234A\">Student profile:<\u002Fstrong> name, grade level, selected subject(s), and plan/trial status, as entered by the parent.<\u002Fli><li><strong style=\"font-weight:600;color:#11234A\">Tutoring activity:<\u002Fstrong> questions asked and subjects studied with Jarvis, used only to operate and improve the tutoring experience.<\u002Fli><\u002Ful>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We do not currently collect payment information. iMindz is offered as a Free Trial while the platform is tested; this policy will be updated before any paid plan requires payment details.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">How Jarvis, our AI tutor, works<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">When a student asks Jarvis a question, it is sent through a secured backend (a Cloudflare Worker) to Anthropic’s Claude API to generate a tutoring response. Our API credentials are never exposed in the website code, and tutoring conversations are handled under Anthropic’s standard API data-handling terms.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Where your data is stored<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Account and profile data is stored with Supabase (PostgreSQL database and authentication). Row-level security ensures a parent can only ever access their own family’s records — not other families’ data.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Third parties we use<\u002Fh2>\n<ul style=\"margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font:400 16px/1.65 'IBM Plex Sans';color:#33405A\"><li>Supabase — database and authentication<\u002Fli><li>Cloudflare — secure proxy for AI tutoring requests<\u002Fli><li>Anthropic — generates Jarvis’s tutoring responses<\u002Fli><li>Google — optional sign-in<\u002Fli><\u002Ful>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">None of these parties are permitted to sell your personal information.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Cookies<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We use only essential cookies and local storage needed to keep you signed in. We do not use advertising or third-party tracking cookies.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Your rights as a parent<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">You can request to access, correct, or delete your family’s data at any time by contacting us at the email below. Deleting your account removes your profile and all linked student profiles.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Changes to this policy<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We may update this policy as the platform develops. Material changes will be posted here with a revised date.<\u002Fp>\n<h2 style=\"margin:14px 0 0;font:700 21px/1.3 'IBM Plex Sans';letter-spacing:-0.01em;color:#11234A\">Contact us<\u002Fh2>\n<p style=\"margin:0;font:400 16px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Questions about this policy or your data: <a href=\"mailto:imindzcanada@gmail.com\">imindzcanada@gmail.com<\u002Fa><\u002Fp>\n<div style=\"margin-top:18px;padding-top:16px;border-top:1px solid #E6DFD0;display:flex;flex-wrap:wrap;gap:8px 24px;font:500 14.5px 'IBM Plex Sans'\"><a href=\"#terms\" sc-camel-on-click=\"{{ goTerms }}\">Terms of Service<\u002Fa><a href=\"#privacy\" sc-camel-on-click=\"{{ goPrivacy }}\">Privacy Policy<\u002Fa><a href=\"mailto:imindzcanada@gmail.com\">Contact imindzcanada@gmail.com<\u002Fa><\u002Fdiv>\n<\u002Farticle>\n<\u002Fsection>\n<\u002Fsc-if>\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;margin:0 calc(50% - var(--vw) / 2);background-image:linear-gradient(125deg,#1C3C84 0%,#21499A 55%,#2A5BAD 100%);color:#fff;padding:40px max(18px, calc((var(--vw) - 1240px) / 2 + 32px)) 44px\">\n      <div style=\"max-width:760px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 11.5px 'IBM Plex Mono';letter-spacing:.1em;color:oklch(0.85 0.12 70)\">IMINDZ<\u002Fspan><h1 style=\"margin:0;font:700 clamp(28px, 4.4vw, 38px)/1.1 'Sora';letter-spacing:-0.03em\">About Us<\u002Fh1><\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"padding:56px clamp(16px, 2.6vw, 32px) 48px;background:#fff\">\n      <div style=\"max-width:1080px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:36px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:36px 56px;align-items:center\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">IDEA BEHIND IMINDZ<\u002Fspan><p style=\"margin:0;font:500 clamp(19px, 2.4vw, 22px)/1.5 'IBM Plex Sans';color:#11234A;text-wrap:pretty\">Think back to your school days. When you got stuck on a problem, who did you turn to?<\u002Fp><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Maybe a teacher, a parent, or someone who could give you just a little direction. They didn’t always hand you the answer. They asked a question, offered a hint, helped you revisit a fundamental or pointed you to the next step. And suddenly you were back on track, working it out yourself.<\u002Fp><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We see the same thing with our own children today. Often, students don’t need another lesson or a ready-made answer. They just need a little nudge to get their thinking going.<\u002Fp><p style=\"margin:0;font:700 clamp(30px, 4vw, 36px)/1.15 'Caveat',cursive;color:#11234A\">That’s the idea behind iMindz.<\u002Fp><\u002Fdiv>\n          <img src=\"/assets/a909c49b-92c7-47db-bd5c-fe29d7f5ca8b.jpg\" alt=\"A Grade 9 student thinking through a problem while Jarvis offers a nudge, a hint, an example and next steps\" style=\"display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;box-shadow:0 18px 40px rgba(17,35,74,.16)\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px;padding:28px clamp(16px, 2.4vw, 24px);border-radius:18px;background:#FAF7F0;border:1px solid #EDE6D8\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:oklch(0.5 0.12 65)\">HOW JARVIS GETS THEM UNSTUCK<\u002Fspan><dc-import name=\"Nudge Flow\" hint-size=\"100%,190px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"padding:56px clamp(16px, 2.6vw, 32px);background:#11234A;color:#fff\">\n      <div style=\"max-width:1080px;margin:0 auto;width:100%;box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:36px 48px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#FFA733\">MEET JARVIS<\u002Fspan><div style=\"display:flex;align-items:center;gap:16px\"><img src=\"/assets/fc039281-f4c3-4efc-88f5-4671f61442c3.png\" alt=\"Jarvis\" style=\"width:68px;height:68px;border-radius:20px;object-fit:cover\"><h2 style=\"margin:0;font:700 clamp(30px, 4.4vw, 38px)/1.1 'IBM Plex Sans';letter-spacing:-0.02em\">Meet <span style=\"color:oklch(0.86 0.13 75)\">Jarvis<\u002Fspan><\u002Fh2><\u002Fdiv><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#E6ECF5;text-wrap:pretty\">We built iMindz to make that kind of guidance available whenever students need it. Jarvis, our AI-powered learning companion, gives thoughtful questions, progressive hints and step-by-step guidance, so students understand the problem and discover the solution themselves.<\u002Fp><span style=\"font:600 16px/1.5 'IBM Plex Sans';color:#fff;text-wrap:pretty\">Jarvis never just gives the answer. It gives the smallest hint that helps, and steps up only if your child is still stuck.<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;background:rgba(255,255,255,0.06)\"><span style=\"font:600 12px 'IBM Plex Mono';color:oklch(0.85 0.13 75)\">STEP 1<\u002Fspan><span style=\"font:700 17px 'IBM Plex Sans';color:#fff\">Nudge<\u002Fspan><span style=\"font:400 14px/1.45 'IBM Plex Sans';color:#C7D4E6\">A question that points the way.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;background:rgba(255,255,255,0.11)\"><span style=\"font:600 12px 'IBM Plex Mono';color:oklch(0.85 0.13 75)\">STEP 2<\u002Fspan><span style=\"font:700 17px 'IBM Plex Sans';color:#fff\">Clue<\u002Fspan><span style=\"font:400 14px/1.45 'IBM Plex Sans';color:#C7D4E6\">Names the idea or the next move.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:12px;background:rgba(255,255,255,0.16)\"><span style=\"font:600 12px 'IBM Plex Mono';color:oklch(0.85 0.13 75)\">STEP 3<\u002Fspan><span style=\"font:700 17px 'IBM Plex Sans';color:#fff\">Example<\u002Fspan><span style=\"font:400 14px/1.45 'IBM Plex Sans';color:#C7D4E6\">A similar worked problem. Never their own.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:oklch(0.85 0.13 75)\">WHAT IT LOOKS LIKE<\u002Fspan><div style=\"align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:14px 14px 4px 14px;background:#fff;color:#11234A;font:500 15px/1.45 'IBM Plex Sans'\">Solve 2(x − 3) = 4x + 10. I’m stuck.<\u002Fdiv><div style=\"display:flex;gap:10px;align-items:flex-end;max-width:92%\"><img src=\"/assets/fc039281-f4c3-4efc-88f5-4671f61442c3.png\" alt=\"\" style=\"flex:none;width:28px;height:28px;border-radius:8px;object-fit:cover\"><div style=\"padding:10px 14px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.12);color:#fff;font:400 15px/1.45 'IBM Plex Sans'\">Let’s figure it out together. What happens if you expand the brackets on the left?<\u002Fdiv><\u002Fdiv><div style=\"align-self:flex-end;max-width:85%;padding:10px 14px;border-radius:14px 14px 4px 14px;background:#fff;color:#11234A;font:500 15px/1.45 'IBM Plex Sans'\">2x − 6 = 4x + 10<\u002Fdiv><div style=\"display:flex;gap:10px;align-items:flex-end;max-width:92%\"><img src=\"/assets/fc039281-f4c3-4efc-88f5-4671f61442c3.png\" alt=\"\" style=\"flex:none;width:28px;height:28px;border-radius:8px;object-fit:cover\"><div style=\"padding:10px 14px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.12);color:#fff;font:400 15px/1.45 'IBM Plex Sans'\">Nice move. Which side do you want to collect the x terms on?<\u002Fdiv><\u002Fdiv><span style=\"font:400 14px/1.5 'IBM Plex Sans';color:#C7D4E6\">Jarvis keeps going until your child solves it, then offers a similar question to practise.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"padding:56px clamp(16px, 2.6vw, 32px) 64px;background:#FAF7F0;border-top:1px solid #EDE6D8\">\n      <div style=\"max-width:1080px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px 56px;align-items:start\"><div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">PEOPLE BEHIND IMINDZ<\u002Fspan><h2 style=\"margin:0;font:700 clamp(28px, 4vw, 34px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A\">Built by Parents.<br>Shaped by Teachers.<\u002Fh2><\u002Fdiv><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We’re parents of high schoolers, and we know how much great teachers matter. Nothing replaces learning in a classroom, working with teachers and growing alongside classmates. That’s why we work closely with Ontario teachers and education specialists, including psychoeducational consultants, so the iMindz experience stays true to the classroom.<\u002Fp><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px\"><div style=\"display:flex;flex-direction:column;border-radius:16px;background:#fff;border:1px solid #E6DFD0;overflow:hidden\"><div style=\"position:relative;width:100%;aspect-ratio:4/3;overflow:hidden\"><img src=\"/assets/00cc25d2-4536-4558-8e46-3956f00c4708.jpg\" alt=\"A parent of a high schooler at his home desk\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:18px 20px 20px\"><span style=\"font:700 17px 'IBM Plex Sans';color:#11234A\">Parents<\u002Fspan><span style=\"font:400 14.5px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">We’re parents of high schoolers. We built exactly what we wanted for our own kids. And they’re now using it every day.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:16px;background:#fff;border:1px solid #E6DFD0;overflow:hidden\"><div style=\"position:relative;width:100%;aspect-ratio:4/3;overflow:hidden\"><img src=\"/assets/f857da87-fe1a-47f0-a2e6-85f58a572ebe.jpg\" alt=\"An Ontario Certified Teacher in a Grade 9 classroom\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:18px 20px 20px\"><span style=\"font:700 17px 'IBM Plex Sans';color:#11234A\">Ontario Certified Teachers<\u002Fspan><span style=\"font:400 14.5px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Keep every hint aligned with the Ontario curriculum and how it’s taught.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;border-radius:16px;background:#fff;border:1px solid #E6DFD0;overflow:hidden\"><div style=\"position:relative;width:100%;aspect-ratio:4/3;overflow:hidden\"><img src=\"/assets/39bda916-7a14-43fa-80c0-cb8ecddc1b81.jpg\" alt=\"A registered psychologist offering psychoeducational support\" style=\"position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:18px 20px 20px\"><span style=\"font:700 17px 'IBM Plex Sans';color:#11234A\">Registered Psychologists &amp; Psychological Associates<\u002Fspan><span style=\"font:400 14.5px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Bring psychoeducational expertise, so every hint fits how students think and learn.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;overflow:hidden;margin:0 calc(50% - var(--vw) / 2);background-color:#1C3C84;background-image:linear-gradient(115deg,#18346F 0%,#1C3C84 45%,#2A5BAD 100%);color:#fff;padding:22px max(18px, calc((var(--vw) - 1240px) / 2 + 32px)) 24px\">\n      <div aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;right:0;width:30%;pointer-events:none;-webkit-mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.25) 30%, #000 65%);mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.25) 30%, #000 65%)\"><span style=\"position:absolute;right:60px;top:14px;font:700 56px 'IBM Plex Mono';color:oklch(0.85 0.12 70);opacity:.22;transform:rotate(-10deg)\">π<\u002Fspan><span style=\"position:absolute;right:210px;top:30px;font:600 24px 'IBM Plex Mono';color:#fff;opacity:.16;transform:rotate(6deg)\">y = mx + b<\u002Fspan><span style=\"position:absolute;right:120px;top:115px;font:700 34px 'IBM Plex Sans';color:oklch(0.82 0.1 45);opacity:.2;transform:rotate(8deg)\">N ↑<\u002Fspan><span style=\"position:absolute;right:280px;top:150px;font:600 26px 'IBM Plex Mono';color:#fff;opacity:.14\">x²<\u002Fspan><span style=\"position:absolute;right:40px;top:190px;font:600 30px 'IBM Plex Sans';color:oklch(0.8 0.12 300);opacity:.2;transform:rotate(-8deg)\">△<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;flex-direction:column;justify-content:center;gap:12px\">\n      <div style=\"position:relative;display:flex;align-items:center;gap:10px\"><span style=\"flex:none;position:relative;display:block;width:26px;height:26px\"><img src=\"/assets/fc039281-f4c3-4efc-88f5-4671f61442c3.png\" alt=\"Jarvis\" style=\"display:block;width:100%;height:100%;border-radius:9px;object-fit:cover\"><span style=\"position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;box-sizing:border-box;border-radius:50%;background:oklch(0.72 0.17 150);border:2px solid #1C3C84\"><\u002Fspan><\u002Fspan><span style=\"font:500 11.5px 'IBM Plex Mono';letter-spacing:.1em;color:oklch(0.85 0.12 70)\">IMINDZ · BUILD YOUR PLAN<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;flex-wrap:wrap;gap:12px 40px;align-items:center;max-width:1000px\">\n        <div style=\"flex:0 1 300px;display:flex;flex-direction:column;gap:4px\"><h2 style=\"margin:0;font:700 26px/1.1 'IBM Plex Sans';letter-spacing:-0.02em\">Welcome to <span style=\"color:oklch(0.86 0.13 75)\">iMindz<\u002Fspan>!<\u002Fh2><p style=\"margin:0;font:600 16px/1.25 'IBM Plex Sans';color:#fff\">We’re glad you’re here.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1 1 380px;min-width:0;padding-left:20px;border-left:2px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:4px\"><p style=\"margin:0;font:400 16px/1.4 'IBM Plex Sans';color:#E6ECF5;text-wrap:pretty\">Let’s start by learning about the student’s needs and learning style.<\u002Fp><p style=\"margin:0;font:400 16px/1.4 'IBM Plex Sans';color:#E6ECF5;text-wrap:pretty\">We’ll take it from there.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n  style=\"flex:none;width:18px;height:18px;border-radius:50%;background:oklch(0.94 0.06 150);color:oklch(0.4 0.12 150);display:flex;align-items:center;justify-content:center;font:700 10.5px 'IBM Plex Sans'\">✓<\u002Fspan>Rooted in the Ontario curriculum<\u002Fspan><span style=\"display:flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;border-radius:999px;background:#fff;border:1px solid #E6DFD0;font:500 12.5px/1.3 'IBM Plex Sans';color:#6B7487;white-space:nowrap\"><span style=\"flex:none;width:18px;height:18px;border-radius:50%;background:oklch(0.94 0.06 150);color:oklch(0.4 0.12 150);display:flex;align-items:center;justify-content:center;font:700 10.5px 'IBM Plex Sans'\">✓<\u002Fspan>Your privacy comes first<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n\n    <\u002Fsc-if>\n  <sc-if value=\"{{ isCurric }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;overflow:hidden;margin:0 calc(50% - var(--vw) / 2);background-color:oklch(0.36 0.08 185);background-image:linear-gradient(115deg, oklch(0.33 0.08 185) 0%, oklch(0.36 0.08 185) 45%, oklch(0.46 0.10 167) 100%);color:#fff;padding:32px max(18px, calc((var(--vw) - 1240px) / 2 + 32px)) 43px\">\n      <div aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;right:0;width:66%;pointer-events:none;overflow:hidden;display:{{ artDisp }};flex-wrap:wrap;align-content:center;justify-content:flex-end;gap:10px;padding:{{ artPad }};box-sizing:border-box;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));grid-auto-rows:44px;align-items:center;justify-items:center;-webkit-mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.25) 28%, #000 62%);mask-image:linear-gradient(90deg, transparent 0%, rgba(0,0,0,.25) 28%, #000 62%)\"><sc-for list=\"{{ homeArt }}\" as=\"a\" hint-placeholder-count=\"0\"><span style=\"position:{{ a.pos }};left:{{ a.left }};top:{{ a.top }};font:{{ a.font }};color:{{ a.color }};-webkit-text-stroke:{{ a.stroke }};background:{{ a.bg }};padding:{{ a.pad }};border-radius:{{ a.rad }};opacity:{{ a.op }};transform:{{ a.tf }};white-space:nowrap;line-height:1\">{{ a.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <div style=\"position:relative;min-height:calc(clamp(28px, 4.4vw, 38px) * 1.1 + 52px);display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:none\"><span style=\"font:500 11.5px 'IBM Plex Mono';letter-spacing:.1em;color:#E3F5E1;margin-bottom:-8px\">CURRICULUM<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px\"><h1 style=\"margin:0;font:700 clamp(28px, 4.4vw, 38px)/1.1 'Sora';letter-spacing:-0.03em\">Grade 9 Curriculum<\u002Fh1><p style=\"margin:0;font:400 16px/1.6 'IBM Plex Sans';color:oklch(0.9 0.14 88)\">Simplified for you.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <section style=\"padding:84px clamp(16px, 2.6vw, 32px) 88px;background:#FAF7F0\">\n      <div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:32px\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-start\"><div style=\"flex:0 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">DECODING THE CURRICULUM<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px\"><h2 style=\"margin:0;font:700 clamp(26px, 3.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">Making the Ontario Curriculum Easier to Understand<\u002Fh2><\u002Fdiv><\u002Fdiv><div style=\"flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:10px\"><p style=\"margin:0;font:600 18px/1.5 'IBM Plex Sans';color:#11234A;text-wrap:pretty\">What will you learn this year? What are teachers looking for? And how are your marks determined?<\u002Fp><p style=\"margin:0;font:400 17px/1.7 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">We’ve brought together the key information from Ontario’s Grade 9 Math and Science curriculum and explained it in simple terms. From learning expectations and assessment criteria to grading and course content, here’s what students and parents need to know — all in one place.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fsection><section style=\"margin:0 calc(50% - var(--vw) / 2);padding:88px clamp(16px, 2.6vw, 32px) 92px;background:#fff;border-top:1px solid #EDE6D8\"><div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:680px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">WHAT TEACHERS LOOK FOR<\u002Fspan><h2 style=\"margin:0;font:700 clamp(26px, 3.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">The right answer isn’t enough.<\u002Fh2><p style=\"margin:0;font:400 16px/1.55 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Every Grade 9 course is marked on the same four skills. Here’s what a teacher checks for in each.<\u002Fp><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:12px\"><div style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:#fff;border:1px solid #E6DFD0\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:10px;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px 'Sora'\">K<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\"><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Knowledge &amp; Understanding<\u002Fspan><span style=\"font:400 13.5px/1.4 'IBM Plex Sans';color:#5B6577\">Knows the facts and why they work.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Uses the right terms, formulas and definitions<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Explains the idea, not just the procedure<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:#fff;border:1px solid #E6DFD0\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:10px;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px 'Sora'\">T<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\"><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Thinking &amp; Investigation<\u002Fspan><span style=\"font:400 13.5px/1.4 'IBM Plex Sans';color:#5B6577\">Plans an approach and works it through.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Chooses a method and can say why<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>In Science: plans a fair test and controls variables<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:#fff;border:1px solid #E6DFD0\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:10px;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px 'Sora'\">C<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\"><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Communication<\u002Fspan><span style=\"font:400 13.5px/1.4 'IBM Plex Sans';color:#5B6577\">Makes the thinking easy to follow.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Shows every step in a logical order<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Correct symbols, units and labelled graphs or diagrams<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;background:#fff;border:1px solid #E6DFD0\"><div style=\"display:flex;align-items:center;gap:12px\"><span style=\"flex:none;width:36px;height:36px;border-radius:10px;background:#11234A;color:#fff;display:flex;align-items:center;justify-content:center;font:700 16px 'Sora'\">A<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\"><span style=\"font:700 16px 'IBM Plex Sans';color:#11234A\">Application<\u002Fspan><span style=\"font:400 13.5px/1.4 'IBM Plex Sans';color:#5B6577\">Uses learning in new situations.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:5px;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Solves problems that don’t look like the examples<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:8px;font:400 14px/1.45 'IBM Plex Sans';color:#33405A\"><span style=\"flex:none;color:oklch(0.5 0.13 150);font-weight:700\">✓<\u002Fspan><span>Connects ideas to real life and other subjects<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:14px;background:#F3EEE4\"><span style=\"font:700 15.5px 'IBM Plex Sans';color:#11234A\">What this means for your work<\u002Fspan><span style=\"display:flex;gap:10px;font:400 14.5px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\"><span style=\"flex:none;margin-top:7px;width:6px;height:6px;border-radius:50%;background:#2B63A4\"><\u002Fspan><span><b>Show your steps.<\u002Fb> A correct answer with no work can’t earn Thinking or Communication marks.<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:10px;font:400 14.5px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\"><span style=\"flex:none;margin-top:7px;width:6px;height:6px;border-radius:50%;background:#2B63A4\"><\u002Fspan><span><b>Check that it makes sense.<\u002Fb> Is the answer reasonable? Does it have the right units?<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:10px;font:400 14.5px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\"><span style=\"flex:none;margin-top:7px;width:6px;height:6px;border-radius:50%;background:#2B63A4\"><\u002Fspan><span><b>Back it up.<\u002Fb> In Science, conclusions should be supported by your data and observations.<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:10px;font:400 14.5px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\"><span style=\"flex:none;margin-top:7px;width:6px;height:6px;border-radius:50%;background:#2B63A4\"><\u002Fspan><span><b>Math only:<\u002Fb> the course also builds seven <i>mathematical processes<\u002Fi> (problem solving, reasoning and proving, reflecting, connecting, communicating, representing, and selecting tools and strategies). They show up in your Thinking and Communication marks.<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:10px;font:400 14.5px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\"><span style=\"flex:none;margin-top:7px;width:6px;height:6px;border-radius:50%;background:#2B63A4\"><\u002Fspan><span><b>Learning skills<\u002Fb> such as organization, responsibility and collaboration are reported separately on the report card.<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsection><section style=\"padding:88px clamp(16px, 2.6vw, 32px) 92px;background:#FAF7F0;border-top:1px solid #EDE6D8\"><div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:24px\"><div style=\"display:flex;flex-direction:column;gap:10px;max-width:680px\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">HOW MARKS WORK<\u002Fspan><h2 style=\"margin:0;font:700 clamp(26px, 3.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">How you’re assessed.<\u002Fh2><p style=\"margin:0;font:400 16px/1.55 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">Your Grade 9 Math and Science mark has three parts. Here’s what each one means for you.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"display:flex;gap:24px;min-height:0\"><div style=\"flex:none;width:96px;border-radius:14px 14px 4px 4px;background:url(&quot;/assets/5b1ac29b-53c8-4490-8ff4-c4525976c272.jpg&quot;) center/100% 100% no-repeat;display:flex;justify-content:center;align-items:center;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(17,35,74,.12)\"><span style=\"font:800 24px/1 'Sora';letter-spacing:-0.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)\">65%<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px 0 18px;border-bottom:1px solid #E6DFD0\"><div style=\"display:flex;flex-direction:column;gap:4px\"><h3 style=\"margin:0;font:700 18px/1.3 'IBM Plex Sans';color:#11234A\">Classwork<\u002Fh3><p style=\"margin:0;font:400 15px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">The biggest part of your mark, built from work done during the course.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Tests &amp; quizzes<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Assignments<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Projects<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Presentations<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Labs (Science)<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Conversations with your teacher<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px 24px\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 10.5px 'IBM Plex Mono';letter-spacing:.12em;color:#7A8699\">HOW THE MARK IS DECIDED<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Teachers look at your most recent and most consistent work and use their judgement. It’s not just a straight average, so improving late in the course counts.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 10.5px 'IBM Plex Mono';letter-spacing:.12em;color:#7A8699\">PRACTICE VS. GRADED<\u002Fspan><span style=\"font:400 14px/1.5 'IBM Plex Sans';color:#33405A;text-wrap:pretty\">Practice work and check-in quizzes are for feedback and don’t count. Tests, assignments and projects do.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font:600 10.5px 'IBM Plex Mono';letter-spacing:.12em;color:#7A8699\">EACH PIECE IS MARKED ON A LEVEL<\u002Fspan><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:6px\"><div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #E6DFD0\"><span style=\"font:700 14px 'IBM Plex Sans';color:#11234A\">Level 1<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#2B63A4\">50–59%<\u002Fspan><span style=\"font:400 12.5px/1.35 'IBM Plex Sans';color:#5B6577\">Below the standard<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #E6DFD0\"><span style=\"font:700 14px 'IBM Plex Sans';color:#11234A\">Level 2<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#2B63A4\">60–69%<\u002Fspan><span style=\"font:400 12.5px/1.35 'IBM Plex Sans';color:#5B6577\">Approaching<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#11234A;border:1px solid #11234A\"><span style=\"font:700 14px 'IBM Plex Sans';color:#fff\">Level 3<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:oklch(0.86 0.13 75)\">70–79%<\u002Fspan><span style=\"font:400 12.5px/1.35 'IBM Plex Sans';color:#C7D4E6\">The provincial standard<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #E6DFD0\"><span style=\"font:700 14px 'IBM Plex Sans';color:#11234A\">Level 4<\u002Fspan><span style=\"font:600 13px 'IBM Plex Mono';color:#2B63A4\">80–100%<\u002Fspan><span style=\"font:400 12.5px/1.35 'IBM Plex Sans';color:#5B6577\">Above the standard<\u002Fspan><\u002Fdiv><\u002Fdiv><span style=\"font:400 13px/1.45 'IBM Plex Sans';color:#5B6577\">Below 50%, no credit is earned for the course.<\u002Fspan><\u002Fdiv><p style=\"margin:0;font:600 14px/1.45 'IBM Plex Sans';color:#11234A;text-wrap:pretty\"><span style=\"font:600 10.5px 'IBM Plex Mono';letter-spacing:.12em;color:#7A8699;margin-right:8px\">KEY FACT<\u002Fspan>Each piece is marked on four skills: Knowledge, Thinking, Communication and Application.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;min-height:155px\"><div style=\"flex:none;width:96px;border-radius:4px;background:url(&quot;/assets/6b5ad779-616a-48ae-bf5a-48c89e99ec8b.jpg&quot;) center/100% 100% no-repeat;display:flex;justify-content:center;align-items:center;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(17,35,74,.12)\"><span style=\"font:800 24px/1 'Sora';letter-spacing:-0.02em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)\">20%<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px 0 18px;border-bottom:1px solid #E6DFD0\"><div style=\"display:flex;flex-direction:column;gap:4px\"><h3 style=\"margin:0;font:700 18px/1.3 'IBM Plex Sans';color:#11234A\">Final exam<\u002Fh3><p style=\"margin:0;font:400 15px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">One written exam at the end of the course, covering everything you’ve learned.<\u002Fp><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px\"><div style=\"display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid #E6DFD0\"><div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:700 14px 'IBM Plex Sans';color:#11234A\">Math<\u002Fspan><span style=\"font:500 11.5px 'IBM Plex Mono';color:#7A8699\">MTH1W<\u002Fspan><\u002Fdiv><span style=\"font:400 14px/1.45 'IBM Plex Sans';color:#33405A\">The <b>EQAO Grade 9 math test<\u002Fb> is the final exam.<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:4px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid #E6DFD0\"><div style=\"display:flex;align-items:baseline;gap:8px\"><span style=\"font:700 14px 'IBM Plex Sans';color:#11234A\">Science<\u002Fspan><span style=\"font:500 11.5px 'IBM Plex Mono';color:#7A8699\">SNC1W<\u002Fspan><\u002Fdiv><span style=\"font:400 14px/1.45 'IBM Plex Sans';color:#33405A\">A <b>written exam<\u002Fb> during the school’s exam period.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:24px;min-height:115px\"><div style=\"flex:none;width:96px;border-radius:4px 4px 14px 14px;background:url(&quot;/assets/c050e9f2-aa05-4504-a87c-e7e8d792323b.jpg&quot;) center/100% 100% no-repeat;display:flex;justify-content:center;align-items:center;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(17,35,74,.12)\"><span style=\"font:800 24px/1 'Sora';letter-spacing:-0.02em;color:#11234A;text-shadow:none\">15%<\u002Fspan><\u002Fdiv><div style=\"flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px 0 18px;\"><div style=\"display:flex;flex-direction:column;gap:4px\"><h3 style=\"margin:0;font:700 18px/1.3 'IBM Plex Sans';color:#11234A\">Attendance &amp; participation<\u002Fh3><p style=\"margin:0;font:400 15px/1.5 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">New for 2026–27: showing up and taking part now counts toward your mark.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Being in class<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Arriving on time<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Sans';color:#11234A;padding:4px 10px;border-radius:999px;background:#F1EBDF\">Taking part<\u002Fspan><\u002Fdiv><p style=\"margin:0;font:600 14px/1.45 'IBM Plex Sans';color:#11234A;text-wrap:pretty\"><span style=\"font:600 10.5px 'IBM Plex Mono';letter-spacing:.12em;color:#7A8699;margin-right:8px\">KEY FACT<\u002Fspan>Excused absences don’t count against you.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection><section ref=\"{{ cgCardsRef }}\" style=\"margin:0 calc(50% - var(--vw) / 2);padding:88px clamp(16px, 2.6vw, 32px) 92px;background:#fff;border-top:1px solid #EDE6D8\">\n      <div style=\"max-width:960px;margin:0 auto;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center\"><span style=\"font:600 11.5px 'IBM Plex Mono';letter-spacing:.14em;color:#2B63A4\">BY SUBJECT<\u002Fspan><h2 style=\"margin:0;font:700 clamp(26px, 3.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A\">Your curriculum at a glance<\u002Fh2><\u002Fdiv>\n        <div role=\"tablist\" aria-label=\"Choose a subject\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;max-width:640px;width:100%;margin:0 auto\"><sc-for list=\"{{ cgCards }}\" as=\"x\" hint-placeholder-count=\"2\"><div sc-camel-on-click=\"{{ x.pick }}\" role=\"tab\" aria-selected=\"{{ x.sel }}\" style=\"display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;box-sizing:border-box;border-radius:14px;background:{{ x.bg }};border:2px solid {{ x.bd }};cursor:pointer;box-shadow:{{ x.sh }};transition:background .2s,border-color .2s,box-shadow .2s\" style-hover=\"border-color:#11234A\"><span style=\"flex:none;width:24px;height:24px;border-radius:50%;box-sizing:border-box;border:2px solid {{ x.ring }};background:{{ x.dot }};color:#11234A;display:flex;align-items:center;justify-content:center;font:700 13px 'IBM Plex Sans'\">{{ x.tick }}<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:1px;min-width:0\"><span style=\"font:700 17px 'IBM Plex Sans';color:{{ x.ink }}\">{{ x.name }}<\u002Fspan><span style=\"font:500 12.5px 'IBM Plex Mono';letter-spacing:.04em;color:{{ x.sub }}\">{{ x.code }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <p style=\"margin:0;text-align:center;font:400 15px/1.55 'IBM Plex Sans';color:#5B6577;text-wrap:pretty\">Each strand has <b style=\"color:#11234A\">overall expectations<\u002Fb> (the big goals) and <b style=\"color:#11234A\">specific expectations<\u002Fb> (the smaller skills that build them).<\u002Fp>\n    <sc-if value=\"{{ cgMath }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:28px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;align-items:flex-start\">\n        <div style=\"flex:1 1 320px\"><div style=\"font:600 11px 'IBM Plex Sans';letter-spacing:.14em;color:#2B63A4\">BUILT ON THE ONTARIO CURRICULUM<\u002Fdiv><h2 style=\"margin:10px 0 0;font:700 clamp(24px, 4.6vw, 32px)/1.15 'IBM Plex Sans';letter-spacing:-0.02em;color:#11234A;text-wrap:balance\">Grade 9 Math Curriculum.<\u002Fh2><div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:16px\"><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#11234A;border:1px solid #11234A\"><span style=\"font:700 13px 'IBM Plex Mono';color:#fff\">MTH1W<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#C7D4E6\">COURSE CODE<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F2EA;border:1px solid #E6DFD1\"><span style=\"font:700 13px 'IBM Plex Mono';color:#11234A\">2021<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#6B7280\">ISSUED<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F2EA;border:1px solid #E6DFD1\"><span style=\"font:700 13px 'IBM Plex Mono';color:#11234A\">Grade 9<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#6B7280\">DE-STREAMED<\u002Fspan><\u002Fspan><span style=\"display:flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:8px;background:#F6F2EA;border:1px solid #E6DFD1\"><span style=\"font:700 13px 'IBM Plex Mono';color:#11234A\">6<\u002Fspan><span style=\"font:500 10.5px 'IBM Plex Sans';letter-spacing:.08em;color:#6B7280\">STRANDS<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1 1 340px;display:flex;flex-direction:column;gap:12px;margin-top:6px\">\n          <p style=\"margin:0;font:400 15.5px/1.65 'IBM Plex Sans';color:#4A5468;text-wrap:pretty\">iMindz follows the <a href=\"https://www.dcp.edu.gov.on.ca/en/curriculum/secondary-mathematics/courses/mth1w\" target=\"_blank\" rel=\"noopener\" style=\"color:#2B63A4;font-weight:600;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#1B4877\">official Ontario Grade 9 Math curriculum (MTH1W, 2021)<\u002Fa>: the same six strands taught in class.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\"><span style=\"font:700 18px 'IBM Plex Sans';color:#11234A\">What you’ll learn<\u002Fspan><span style=\"font:500 12px 'IBM Plex Mono';letter-spacing:.06em;color:#7A8699\">6 STRANDS<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ noteCols }};gap:14px\"><div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;background:#fff;border:1px solid oklch(0.9 0.04 70);border-radius:12px;min-width:0\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 70);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">B<\u002Fspan><span style=\"min-width:0;max-width:100%;font:700 15px/1.2 'IBM Plex Sans';color:#11234A;text-wrap:balance;overflow-wrap:anywhere\">Number<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• Powers<\u002Fspan><span>• Rational numbers<\u002Fspan><span>• Square roots<\u002Fspan><span>• Proportional reasoning<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">B1<\u002Fb><span>Development of Numbers and Number Sets<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">B2<\u002Fb><span>Powers<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">B3<\u002Fb><span>Number Sense and Operations<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;background:#fff;border:1px solid oklch(0.9 0.04 300);border-radius:12px;min-width:0\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 300);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">C<\u002Fspan><span style=\"min-width:0;max-width:100%;font:700 15px/1.2 'IBM Plex Sans';color:#11234A;text-wrap:balance;overflow-wrap:anywhere\">Algebra<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• Expressions<\u002Fspan><span>• Equations<\u002Fspan><span>• Linear<\u002Fspan><span>• Non-linear relations<\u002Fspan><span>• Coding<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">C1<\u002Fb><span>Algebraic Expressions and Equations<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">C2<\u002Fb><span>Coding<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">C3<\u002Fb><span>Application of Relations<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">C4<\u002Fb><span>Characteristics of Relations<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;background:#fff;border:1px solid oklch(0.9 0.04 195);border-radius:12px;min-width:0\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 195);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">D<\u002Fspan><span style=\"min-width:0;max-width:100%;font:700 15px/1.2 'IBM Plex Sans';color:#11234A;text-wrap:balance;overflow-wrap:anywhere\">Data<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• Collecting<\u002Fspan><span>• Analysing data<\u002Fspan><span>• Mathematical modelling<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">D1<\u002Fb><span>Collection, Representation and Analysis of Data<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">D2<\u002Fb><span>Mathematical Modelling<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;background:#fff;border:1px solid oklch(0.9 0.04 150);border-radius:12px;min-width:0\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 150);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">E<\u002Fspan><span style=\"min-width:0;max-width:100%;font:700 15px/1.2 'IBM Plex Sans';color:#11234A;text-wrap:balance;overflow-wrap:anywhere\">Geometry &amp; Measurement<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• Angles<\u002Fspan><span>• Pythagorean relationship<\u002Fspan><span>• Area<\u002Fspan><span>• Surface area<\u002Fspan><span>• Volume<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">E1<\u002Fb><span>Geometric and Measurement Relationships<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 14px 16px;background:#fff;border:1px solid oklch(0.9 0.04 25);border-radius:12px;min-width:0\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 25);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">F<\u002Fspan><span style=\"min-width:0;max-width:100%;font:700 15px/1.2 'IBM Plex Sans';color:#11234A;text-wrap:balance;overflow-wrap:anywhere\">Financial Literacy<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• Budgets<\u002Fspan><span>• Interest<\u002Fspan><span>• Everyday financial decisions<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid #F0EBE0\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">F1<\u002Fb><span>Financial Decisions<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div aria-hidden=\"true\" style=\"display:{{ noteArrows }};grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:-6px 0\"><span style=\"text-align:center;font:600 18px/1 'IBM Plex Sans';color:#4A5468\">↑<\u002Fspan><span style=\"text-align:center;font:600 18px/1 'IBM Plex Sans';color:#4A5468\">↑<\u002Fspan><span style=\"text-align:center;font:600 18px/1 'IBM Plex Sans';color:#4A5468\">↑<\u002Fspan><span style=\"text-align:center;font:600 18px/1 'IBM Plex Sans';color:#4A5468\">↑<\u002Fspan><span style=\"text-align:center;font:600 18px/1 'IBM Plex Sans';color:#4A5468\">↑<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 18px;background:oklch(0.965 0.03 240);border:1px solid oklch(0.88 0.06 240);border-radius:12px\">\n          <div style=\"display:flex;align-items:center;gap:12px;flex:1 1 280px;min-width:0\"><span style=\"flex:none;width:34px;height:34px;border-radius:10px;background:oklch(0.8 0.12 240);display:flex;align-items:center;justify-content:center;font:700 15px 'IBM Plex Sans';color:#11234A\">A<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span style=\"font:700 15.5px/1.25 'IBM Plex Sans';color:#11234A\">Mathematical Thinking &amp; Making Connections<\u002Fspan><span style=\"font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\">The foundation that runs through every strand above<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:3px 14px;font:400 13.5px/1.4 'IBM Plex Sans';color:#4A5468\"><span>• Problem solving<\u002Fspan><span>• Reasoning<\u002Fspan><span>• Real-life connections<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding-left:16px;border-left:1px solid oklch(0.85 0.06 240)\"><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">A1<\u002Fb><span>Mathematical Processes<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:7px;align-items:baseline;font:500 12.5px/1.35 'IBM Plex Sans';color:#3E4757\"><b style=\"flex:none;font:700 11.5px 'IBM Plex Mono';color:#11234A\">A2<\u002Fb><span>Making Connections<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:14px 0 0;text-align:right;font:400 12px/1.5 'IBM Plex Sans';color:#7A8699\">iMindz Learning Systems is independent and is not affiliated with or endorsed by the Ontario Ministry of Education.<\u002Fp>\n    <\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ cgSci }}\" hint-placeh
